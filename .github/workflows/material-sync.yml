name: Sync official material JSON

on:
  push:
    branches: [main]
    paths:
      - app-core-v2.5.0.html
      - scripts/extract_official_materials.py
      - .github/workflows/material-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract and validate official materials
        run: python scripts/extract_official_materials.py
      - name: Commit generated JSON when changed
        shell: bash
        run: |
          if git diff --quiet -- materials; then
            echo "Material JSON already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add materials
          git commit -m "Generate English LADDER material JSON"
          git push
