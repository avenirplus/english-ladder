<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>English LADDER</title>
<style>
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#f4f6f9;color:#26303f}
  #boot{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
  .boot-card{max-width:420px;width:100%;background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 28px rgba(0,0,0,.08);text-align:center}
  .boot-title{font-weight:800;font-size:1.35rem;margin-bottom:8px}.boot-sub{font-size:.9rem;opacity:.72;line-height:1.7}
  .boot-error{white-space:pre-wrap;text-align:left;color:#9b2c2c;background:#fff4f4;border-radius:12px;padding:12px;margin-top:14px;font-size:.82rem}
</style>
</head>
<body>
<div id="boot"><div class="boot-card"><div class="boot-title">English LADDER</div><div class="boot-sub">教材と学習環境を読み込んでいます…</div></div></div>
<script>
(async function bootEnglishLadder(){
  const fallbackConfig={
    schema:"english-ladder-config@1", appId:"english-ladder", appVersion:"v3.0.0",
    brand:{title:"English LADDER"}, storageKey:"englishLadder:v3",
    legacyStorageKeys:["englishQuestClassroomOS1_student"],
    defaultContext:{schoolYear:2026,courseCode:"LE1",courseName:"論理・表現Ⅰ",grade:1},
    materialsManifest:"materials/manifest.json"
  };
  const getJson=async(path,fallback)=>{ try{ const r=await fetch(path,{cache:"no-store"}); if(!r.ok) throw new Error(r.status+" "+path); return await r.json(); }catch(e){ console.warn("English LADDER:",e); return fallback; } };
  try{
    const cfg=await getJson("config/app-config.json",fallbackConfig);
    const manifest=await getJson(cfg.materialsManifest||"materials/manifest.json",{packs:[]});
    const coreRes=await fetch("app-core-v2.5.0.html",{cache:"no-store"});
    if(!coreRes.ok) throw new Error("core load failed: "+coreRes.status);
    let html=await coreRes.text();

    const enabled=(manifest.packs||[]).filter(x=>x.enabled!==false);
    const settled=await Promise.allSettled(enabled.map(async meta=>{
      const r=await fetch(meta.path,{cache:"no-store"});
      if(!r.ok) throw new Error(meta.path+": "+r.status);
      const p=await r.json();
      p._englishLadderExternal=true;
      return p;
    }));
    const externalPacks=settled.filter(x=>x.status==="fulfilled").map(x=>x.value);
    settled.filter(x=>x.status==="rejected").forEach(x=>console.warn("English LADDER material fallback:",x.reason));

    html=html.replace(/受験クエストOS English Classroom \(STUDENT\)/g,cfg.brand.title)
             .replace(/受験クエストOS English Classroom \(MASTER版\)/g,cfg.brand.title)
             .replace(/受験クエストOS English Classroom/g,cfg.brand.title)
             .replace(/<title>[^<]*<\/title>/i,"<title>"+cfg.brand.title+"</title>");

    const contextLiteral=JSON.stringify({appId:cfg.appId,appVersion:cfg.appVersion,defaultContext:cfg.defaultContext});
    html=html.replace('"use strict";','"use strict";\nconst ENGLISH_LADDER_CONTEXT='+contextLiteral+';');
    html=html.replace('const APP_VERSION="v2.5.0";','const APP_VERSION='+JSON.stringify(cfg.appVersion)+';');

    const oldKey=(cfg.legacyStorageKeys&&cfg.legacyStorageKeys[0])||"englishQuestClassroomOS1_student";
    const keyPatch='const LEGACY_KEY='+JSON.stringify(oldKey)+';\nconst KEY='+JSON.stringify(cfg.storageKey)+';\nif(!localStorage.getItem(KEY)&&localStorage.getItem(LEGACY_KEY)){ localStorage.setItem(KEY,localStorage.getItem(LEGACY_KEY)); }';
    html=html.replace('const KEY="englishQuestClassroomOS1_student";',keyPatch);

    const packLiteral=JSON.stringify(externalPacks).replace(/<\/script/gi,"<\\/script");
    html=html.replace('/*==教材ここまで==*/','/*==教材ここまで==*/\nSAMPLE_PACKS.push(...'+packLiteral+');');
    html=html.replace('for(const p of SAMPLE_PACKS) if(!S.packs[p.id]) S.packs[p.id]=p;',
      'for(const p of SAMPLE_PACKS) if(!S.packs[p.id]||p._englishLadderExternal) S.packs[p.id]=p;');

    html=html.replace('S.version=2; if(!S.firstUse) S.firstUse=today();',
      'S.version=3; S.appMeta=Object.assign({},S.appMeta||{},ENGLISH_LADDER_CONTEXT); if(!S.firstUse) S.firstUse=today();');
    html=html.replace('if(!p.studentInfo) p.studentInfo={cls:"",num:"",nick:""}; // 結果提出用(氏名は保存しない)',
      'if(!p.studentInfo) p.studentInfo={cls:"",num:"",nick:""}; // 結果提出用(氏名は保存しない)\n  if(!p.learningContext) p.learningContext=Object.assign({},ENGLISH_LADDER_CONTEXT.defaultContext); else p.learningContext=Object.assign({},ENGLISH_LADDER_CONTEXT.defaultContext,p.learningContext);');

    html=html.replace('<button class="pill sub" onclick="readQ()">🔊よむ</button>',
      '${q.noRead?"":"<button class=\\"pill sub\\" onclick=\\"readQ()\\">🔊よむ</button>"}');
    html=html.replace('if(p.tts.auto||q.listening) readQ();','if(!q.noRead&&(p.tts.auto||q.listening)) readQ();');
    html=html.replace('function readQ(){ const q=ses.items[ses.i].q;',
      'function readQ(){ const q=ses.items[ses.i].q; if(q.noRead) return;');

    html=html.replace('const result={app:"受験クエストOS",schema:"jq-result@1",exportedAt:new Date().toISOString(),',
      'const result={app:"English LADDER",schema:"jq-result@1",exportedAt:new Date().toISOString(),context:Object.assign({},p.learningContext||ENGLISH_LADDER_CONTEXT.defaultContext),');

    document.open();
    document.write(html);
    document.close();
  }catch(err){
    console.error(err);
    const b=document.getElementById("boot");
    b.innerHTML='<div class="boot-card"><div class="boot-title">English LADDER</div><div class="boot-sub">起動に失敗しました。ページを再読み込みしてください。</div><div class="boot-error"></div></div>';
    b.querySelector(".boot-error").textContent=String(err&&err.message||err);
  }
})();
</script>
</body>
</html>
